<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Study Time</title>
<script>
// Apply the saved design + light/dark before first paint so the page doesn't flash the default look.
(function(){
  try{
    var d = JSON.parse(localStorage.getItem('study-app-data') || '{}');
    var design = (d.design==='cute' || d.design==='neon' || d.design==='violet' || d.design==='sea' || d.design==='calm') ? d.design : 'calm';
    document.documentElement.setAttribute('data-design', design);
    if(d.theme==='dark') document.documentElement.classList.add('dark');
  }catch(e){ document.documentElement.setAttribute('data-design','calm'); }
})();
</script>
<link rel="stylesheet" href="style.css?v=23">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#6C5CE7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StudyTime">
</head>
<body>
<div class="canvas" id="canvas">
  <div class="loading-screen" id="loading">
    <div class="spinner"></div>
    <div>読み込み中...</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
